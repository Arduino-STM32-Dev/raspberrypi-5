<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ESP32 蜂鸣器</title>
<style>
  :root { --bg:#0f1115; --card:#171a21; --line:#242a35; --txt:#e8ecf3; --dim:#8b96a8; --acc:#4f8cff; --ok:#2fbf71; --bad:#e05a5a; --warn:#e0a84a; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body { margin:0; background:var(--bg); color:var(--txt); font:15px/1.5 -apple-system,"Segoe UI",Roboto,"Noto Sans SC",sans-serif; padding:18px; }
  .wrap { max-width:560px; margin:0 auto; }
  h1 { font-size:19px; margin:0 0 4px; font-weight:650; }
  .sub { color:var(--dim); font-size:12.5px; margin-bottom:16px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:18px; margin-bottom:14px; }
  .row { display:flex; align-items:center; justify-content:space-between; gap:12px; }
  .dot { width:9px; height:9px; border-radius:50%; background:var(--bad); display:inline-block; margin-right:7px; }
  .dot.on { background:var(--ok); }
  .vol { font-size:52px; font-weight:700; line-height:1; letter-spacing:-1px; }
  .vol span { font-size:16px; color:var(--dim); font-weight:500; margin-left:4px; }
  input[type=range] { width:100%; margin:18px 0 6px; height:34px; background:transparent; -webkit-appearance:none; }
  input[type=range]::-webkit-slider-runnable-track { height:10px; border-radius:6px; background:linear-gradient(90deg,var(--acc) var(--p,50%),#2b3240 var(--p,50%)); }
  input[type=range]::-webkit-slider-thumb { -webkit-appearance:none; width:28px; height:28px; margin-top:-9px; border-radius:50%; background:#fff; border:3px solid var(--acc); }
  .grid { display:grid; grid-template-columns:repeat(5,1fr); gap:8px; margin-top:12px; }
  .grid3 { display:grid; grid-template-columns:1fr 1fr 1fr; gap:8px; }
  button { font:inherit; color:var(--txt); background:#202634; border:1px solid var(--line); border-radius:10px; padding:11px 8px; cursor:pointer; }
  button:active { transform:scale(.97); }
  button.primary { background:var(--acc); border-color:var(--acc); color:#fff; font-weight:600; }
  button.mute { background:#2a1f22; border-color:#4a2b2f; color:#ff9a9a; }
  button.warn { background:#2a2418; border-color:#4a3d22; color:#f0c674; }
  button.music { background:#1c2433; border-color:#2b3a55; color:#9cc0ff; }
  .log { font:12.5px/1.6 ui-monospace,Menlo,Consolas,monospace; color:var(--dim); max-height:190px; overflow:auto; }
  .log b { color:#a9b6c9; font-weight:600; }
  .hint { color:var(--dim); font-size:12px; margin-top:10px; }
  .err { color:var(--bad); font-size:13px; min-height:18px; margin-top:8px; }
  .badge { display:inline-block; padding:3px 9px; border-radius:999px; font-size:12px; font-weight:600; border:1px solid var(--line); color:var(--dim); }
  .badge.alarm { background:#2a2418; border-color:#4a3d22; color:#f0c674; }
  .badge.music { background:#1c2433; border-color:#2b3a55; color:#9cc0ff; }
</style>
</head>
<body>
<div class="wrap">
  <h1>ESP32 蜂鸣器</h1>
  <div class="sub"><span class="dot" id="dot"></span><span id="conn">连接中…</span> · 发布 <code>{{ pub }}</code></div>

  <div class="card">
    <div class="row" style="margin-bottom:12px">
      <b style="font-size:13px">模式</b>
      <span class="badge" id="modeBadge">IDLE</span>
    </div>
    <div class="grid3">
      <button class="warn" id="btnAlarm">🚨 警报</button>
      <button class="music" id="btnMusic">🎵 音乐</button>
      <button id="btnStop">⏹ 停止</button>
    </div>
    <div class="hint">警报 = 150ms 滴-滴；音乐 = 循环旋律（有源蜂鸣器只出单音）</div>
    <div class="err" id="errMode"></div>
  </div>

  <div class="card">
    <div class="row">
      <div class="vol"><span id="volNum">--</span><span>%</span></div>
      <div style="text-align:right;color:var(--dim);font-size:12.5px" id="lastCmd">—</div>
    </div>
    <input id="vol" type="range" min="0" max="100" step="5" value="0">
    <div class="grid">
      <button data-v="0">0</button>
      <button data-v="25">25</button>
      <button data-v="50">50</button>
      <button data-v="75">75</button>
      <button data-v="100">100</button>
    </div>
    <div class="grid3" style="margin-top:8px">
      <button class="primary" id="apply" style="grid-column:span 2">发送音量</button>
      <button class="mute" id="mute">静音</button>
    </div>
    <div class="err" id="err"></div>
    <div class="hint">0 = 静音，100 = 最大（固件 <code>pwm = 255 - volume*255/100</code>）</div>
  </div>

  <div class="card">
    <div class="row" style="margin-bottom:8px">
      <b style="font-size:13px">实时数据</b>
      <span style="color:var(--dim);font-size:12px" id="statusAt">—</span>
    </div>
    <div class="log" id="log">等待数据…</div>
  </div>

  <div class="card">
    <div style="font-size:13px;margin-bottom:8px"><b>自定义指令</b> <span style="color:var(--dim);font-size:12px">（非蜂鸣器指令原样转发 STM32）</span></div>
    <div class="row">
      <input id="raw" placeholder="例如 LED_ON / FAN_ON" style="flex:1;background:#12151c;border:1px solid var(--line);color:var(--txt);border-radius:10px;padding:11px 12px;font:inherit">
      <button id="sendRaw">发送</button>
    </div>
  </div>
</div>
<script>
const $ = (id) => document.getElementById(id);
const vol = $('vol');
let mode = 'idle';

function paint(v) {
  $('volNum').textContent = v;
  vol.style.setProperty('--p', v + '%');
}

function setMode(m) {
  mode = m;
  const b = $('modeBadge');
  b.className = 'badge' + (m === 'alarm' ? ' alarm' : m === 'music' ? ' music' : '');
  b.textContent = m.toUpperCase();
}

async function post(path, body, errId) {
  $(errId || 'err').textContent = '';
  try {
    const r = await fetch(path, {
      method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(body)
    });
    const j = await r.json();
    if (!j.ok) $(errId || 'err').textContent = '发送失败：' + (j.error || r.status);
    return j;
  } catch (e) {
    $(errId || 'err').textContent = '网络错误：' + e.message;
    return {ok: false};
  }
}

vol.addEventListener('input', () => paint(+vol.value));
vol.addEventListener('change', () => sendVolume(+vol.value));
document.querySelectorAll('button[data-v]').forEach(b => {
  b.addEventListener('click', () => { const v = +b.dataset.v; vol.value = v; paint(v); sendVolume(v); });
});
$('apply').addEventListener('click', () => sendVolume(+vol.value));
$('mute').addEventListener('click', () => { vol.value = 0; paint(0); sendVolume(0); });

$('btnAlarm').addEventListener('click', async () => {
  const j = await post('/api/alarm', {on: true}, 'errMode');
  if (j.ok) setMode('alarm');
});
$('btnMusic').addEventListener('click', async () => {
  const j = await post('/api/music', {action: 'play'}, 'errMode');
  if (j.ok) setMode('music');
});
$('btnStop').addEventListener('click', async () => {
  const j = await post('/api/alarm', {on: false}, 'errMode');
  if (j.ok) setMode('idle');
});

async function sendVolume(v) {
  const j = await post('/api/buzzer', {volume: v}, 'err');
  if (j.ok) setMode('idle');
}

$('sendRaw').addEventListener('click', async () => {
  const cmd = $('raw').value.trim();
  if (!cmd) return;
  const j = await post('/api/raw', {cmd}, 'err');
  if (j.ok) $('raw').value = '';
});

function t(ts) {
  if (!ts) return '—';
  return new Date(ts * 1000).toLocaleTimeString();
}

async function poll() {
  try {
    const j = await (await fetch('/api/status')).json();
    $('dot').className = 'dot' + (j.mqtt_connected ? ' on' : '');
    $('conn').textContent = (j.mqtt_connected ? 'MQTT 已连接' : 'MQTT 断开') + ' · ' + j.broker;
    if (j.volume !== null && document.activeElement !== vol) { vol.value = j.volume; paint(j.volume); }
    if (j.mode) setMode(j.mode);
    $('lastCmd').textContent = j.last_cmd ? (j.last_cmd + ' · ' + t(j.last_cmd_at)) : '—';
    $('statusAt').textContent = t(j.last_status_at);
    if (j.messages && j.messages.length) {
      $('log').innerHTML = j.messages.map(m =>
        '<div><b>' + t(m.t) + '</b> ' + escapeHtml(m.payload) + '</div>'
      ).join('');
    }
  } catch (e) {
    $('dot').className = 'dot';
    $('conn').textContent = '面板离线';
  }
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

paint(0);
poll();
setInterval(poll, 2000);
</script>
</body>
</html>
